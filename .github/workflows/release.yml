name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号 vX.Y.Z'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: 校验与测试
        run: go vet ./... && go test ./...
      - name: 交叉编译
        env:
          VERSION: ${{ github.ref_name || inputs.tag }}
        run: |
          set -e
          for t in "linux amd64" "linux arm64"; do
            GOOS=${t%% *}; GOARCH=${t##* }
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH \
            go build -trimpath -ldflags "-X main.version=$VERSION -s -w" \
              -o dist/lumeidc_${GOOS}_${GOARCH} ./cmd/lumeidc
          done
          cd dist
          # 每个二进制一个独立 .sha256 侧车（程序侧按资产名精确匹配）
          for f in lumeidc_*; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # 需要完整历史与旧 tag 定位区间
          fetch-tags: true
      - name: 下载构建产物
        env:
          GH_TOKEN: ${{ github.token }}
        # gh CLI 预装且自带鉴权：直接下载本次 workflow run 的 dist artifact，
        # 替代 actions/download-artifact（Node20 弃用警告）。
        run: gh run download "$GITHUB_RUN_ID" -n dist -D dist
      - name: 生成发布说明（自动拉取提交）
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME:-${{ inputs.tag }}}"
          # 取创建时间在 TAG 之前最近的一个 vX.Y.Z tag 作为上一版本。
          # 注意：不能依赖 git describe 沿祖先链找 tag——历史重写/分叉时（如 v0.0.1 打在废弃分支上）
          # 祖先链上可能没有其他 tag，会误走"初始发布"分支。
          PREV=$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags \
            | grep -v "^$TAG$" | head -n 1)
          if [ -n "$PREV" ]; then
            # 以两 tag 的共同祖先为基线，避免全量 log 把上一版本的提交也算进来
            BASE=$(git merge-base "$PREV" "$TAG" 2>/dev/null || true)
            [ -z "$BASE" ] && BASE=$(git rev-list --max-parents=0 "$TAG")
            git log --oneline --no-merges "$BASE..$TAG" | sed 's/^/- /' > notes.md
            [ -s notes.md ] || echo "- ${TAG} 初始发布" > notes.md
          else
            echo "- ${TAG} 初始发布" > notes.md
          fi
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name || inputs.tag }}
        # gh CLI 随 runner 预装且自带鉴权，替代 softprops/action-gh-release（Node20）消除弃用警告
        run: gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md