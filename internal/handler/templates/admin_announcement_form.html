{{define "page"}}
<div class="admin-page-header">
  <div class="admin-page-title">
    <h1>{{if .Product}}编辑公告{{else}}新建公告{{end}}</h1>
    <p>编辑前台用户可以看到的通知内容</p>
  </div>
  <div class="admin-page-actions">
    <a href="/admin/announcements" class="admin-back-btn">返回公告列表</a>
  </div>
</div>

{{if .Error}}<div class="ui-alert ui-alert-error" role="alert">{{.Error}}</div>{{end}}

<form method="post" action="/admin/announcements/save" class="admin-panel admin-edit-max">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  <input type="hidden" name="id" value="{{if .Product}}{{.Product.ID}}{{end}}">
  <div class="admin-panel-body">
    <div class="admin-form-section">
      <label for="announcement-title">公告标题</label>
      <input id="announcement-title" name="title" value="{{if .Product}}{{.Product.Title}}{{end}}" placeholder="输入公告标题" required>
    </div>

    <div class="admin-form-section">
      <label for="announcement-content">公告内容</label>
      <textarea id="announcement-content" name="content" rows="10" placeholder="支持换行">{{if .Product}}{{.Product.Content}}{{end}}</textarea>
    </div>

    <div class="admin-form-section">
      <div class="admin-check-row">
        <label class="check-line">
          <input type="checkbox" name="pinned" {{if and .Product .Product.Pinned}}checked{{end}}>
          置顶（显示在列表顶部）
        </label>
        <label class="check-line">
          <input type="checkbox" name="hidden" {{if and .Product .Product.Hidden}}checked{{end}}>
          隐藏（不展示在前台）
        </label>
      </div>
    </div>

    <div class="admin-form-actions">
      <button class="ui-btn" type="submit">保存公告 <span>→</span></button>
      <a class="ui-btn ui-btn-secondary" href="/admin/announcements">取消</a>
    </div>
  </div>
</form>
{{end}}
