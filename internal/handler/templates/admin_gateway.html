{{define "page"}}
<h1>支付网关：易支付</h1>
{{if .Error}}<p style="color:#b91c1c">{{.Error}}</p>{{end}}
<form method="post" action="/admin/gateway" style="max-width:480px;background:#fff;padding:20px;border-radius:8px">
<input type="hidden" name="_csrf" value="{{.CSRF}}">
<label style="display:block;margin:10px 0 4px;font-weight:600;font-size:.88rem">网关地址</label>
<input name="api_url" value="{{index .Rows "APIURL"}}" placeholder="https://pay.example.com" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px">
<label style="display:block;margin:10px 0 4px;font-weight:600;font-size:.88rem">商户 PID</label>
<input name="pid" value="{{index .Rows "PID"}}" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px">
<label style="display:block;margin:10px 0 4px;font-weight:600;font-size:.88rem">商户密钥</label>
<input name="key" value="{{index .Rows "Key"}}" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px">
<label style="display:block;margin:10px 0 4px;font-weight:600;font-size:.88rem">支付方式</label>
<select name="channel" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px">
<option value="alipay">支付宝</option>
<option value="wxpay">微信</option>
</select>
<button style="margin-top:16px;width:100%;padding:10px;background:#4f46e5;color:#fff;border:0;border-radius:6px;cursor:pointer">保存</button>
</form>
{{end}}
