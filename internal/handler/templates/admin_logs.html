{{define "page"}}
<div class="admin-page-header">
  <div class="admin-page-title">
    
    <h1>审计日志</h1>
    <p>记录管理员对系统数据的操作</p>
  </div>
  <div class="admin-page-actions">
    <span class="text-muted small">共 {{len .Rows}} 条记录</span>
  </div>
</div>

<div class="admin-panel">
  <div class="admin-panel-header">
    <h2>操作记录</h2>
    <label class="list-filter" for="filter-logs">
      <span class="fx-search-icon" aria-hidden="true"></span>
      <input id="filter-logs" type="search" data-table-filter="#tblLogs" placeholder="搜索动作 / 对象 / IP">
    </label>
  </div>
  <div class="admin-table-wrap">
    <table class="admin-table" id="tblLogs" data-pageable data-page-size="25">
      <thead>
        <tr>
          <th scope="col">ID</th>
          <th scope="col">管理员</th>
          <th scope="col">动作</th>
          <th scope="col">对象</th>
          <th scope="col">详情</th>
          <th scope="col">IP</th>
          <th scope="col">时间</th>
        </tr>
      </thead>
      <tbody>
        {{range .Rows}}
        <tr>
          <td class="td-id">{{.ID}}</td>
          <td>#{{.AdminID}}</td>
          <td><span class="admin-log-action">{{.Action}}</span></td>
          <td>{{.TargetType}}#{{.TargetID}}</td>
          <td class="td-detail">{{.Detail}}</td>
          <td class="td-id">{{.IP}}</td>
          <td>{{.CreatedAt}}</td>
        </tr>
        {{end}}
        {{if not .Rows}}
        <tr><td colspan="7" class="admin-table-empty">暂无操作记录</td></tr>
        {{end}}
      </tbody>
    </table>
  </div>
</div>
{{end}}
