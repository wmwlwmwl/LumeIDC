{{define "page"}}
<h1>最近订单（50 条）</h1>
{{if .Error}}<p style="color:#b91c1c">{{.Error}}</p>{{end}}
<table>
<tr><th>ID</th><th>用户</th><th>金额</th><th>周期</th><th>状态</th><th>利润</th><th>退款</th></tr>
{{range .Rows}}<tr>
<td>{{.ID}}</td><td>{{.A}}</td><td>{{.B}}</td><td>{{.C}}</td><td>{{.D}}</td><td>{{.E}}</td>
<td>
<form method="post" action="/admin/orders/{{.ID}}/refund" style="display:flex;gap:4px">
<input type="hidden" name="_csrf" value="{{$.CSRF}}">
<input name="amount" value="{{.B}}" size="6">
<select name="method"><option value="balance">退余额</option><option value="gateway">线下/手动（标记已退款）</option></select>
<input name="reason" placeholder="原因" size="8">
<button type="submit">退款</button>
</form>
</td>
</tr>{{end}}
</table>
<p>总毛利：{{.TotalProfit}} 元</p>
<p><a href="/admin/refunds">查看退款记录</a></p>
{{end}}
