{{define "page"}}
<div class="admin-page-header">
  <div class="admin-page-title">
    <h1>修改密码</h1>
    <p>更新当前管理员账户的登录凭据</p>
  </div>
</div>

{{if .Error}}<div class="ui-alert ui-alert-error" role="alert">{{.Error}}</div>{{end}}
{{if .Msg}}<div class="ui-alert ui-alert-success" role="status">{{.Msg}}</div>{{end}}

<form method="post" action="/admin/password" class="admin-panel admin-form-narrow">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  <div class="admin-panel-body">
    <label for="admin-old-password">旧密码</label>
    <input id="admin-old-password" type="password" name="old_password" required autocomplete="current-password">
    <label for="admin-new-password">新密码（至少 8 位）</label>
    <input id="admin-new-password" type="password" name="new_password" required minlength="8" autocomplete="new-password">
    <label for="admin-confirm-password">确认新密码</label>
    <input id="admin-confirm-password" type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
    <div class="admin-form-actions">
      <button class="ui-btn" type="submit">保存密码 <span>→</span></button>
    </div>
  </div>
</form>

<script>
document.querySelector('form').addEventListener('submit',function(e){
  const f=e.target;
  if(f.new_password.value!==f.confirm_password.value){
    e.preventDefault();
    if(window.LumeUI&&window.LumeUI.toast){LumeUI.toast('两次输入的新密码不一致','error');}else{alert('两次输入的新密码不一致');}
  }
});
</script>
{{end}}
