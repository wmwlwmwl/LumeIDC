{{define "page"}}
<h1>修改密码</h1>
{{if .Error}}<p style="color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:8px 12px;font-size:.88rem">{{.Error}}</p>{{end}}
{{if .Msg}}<p style="color:#15803d;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:8px 12px;font-size:.88rem">{{.Msg}}</p>{{end}}
<div class="card" style="max-width:420px">
<form method="post" action="/admin/password" style="display:flex;flex-direction:column;gap:10px">
<input type="hidden" name="_csrf" value="{{.CSRF}}">
<label style="font-size:.88rem">旧密码
<input type="password" name="old_password" required style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;margin-top:4px">
</label>
<label style="font-size:.88rem">新密码（至少8位）
<input type="password" name="new_password" required minlength="8" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;margin-top:4px">
</label>
<label style="font-size:.88rem">确认新密码
<input type="password" name="confirm_password" required minlength="8" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;margin-top:4px">
</label>
<button type="submit" style="padding:9px;background:#4f46e5;color:#fff;border:0;border-radius:6px;cursor:pointer">保存</button>
</form>
</div>
<script>
document.querySelector('form').addEventListener('submit',function(e){
  const f=e.target;
  if(f.new_password.value!==f.confirm_password.value){
    e.preventDefault();alert('两次输入的新密码不一致');
  }
});
</script>
{{end}}
