{{define "page"}}
<div class="d-flex align-items-center justify-content-between gap-3 flex-wrap mb-4">
<h1 class="h3 mb-0">产品管理</h1>
<a class="ui-btn" href="/admin/products/new">新增产品</a>
</div>
{{if .Error}}<div class="ui-alert ui-alert-error" role="alert">{{.Error}}</div>{{end}}
{{if .Msg}}<div class="ui-alert ui-alert-success" role="status">{{.Msg}}</div>{{end}}
<div class="ui-table-wrap" aria-label="产品列表"><table><thead><tr><th scope="col">ID</th><th scope="col">名称</th><th scope="col">分类</th><th scope="col">月付价</th><th scope="col">显示</th><th scope="col">操作</th></tr></thead><tbody>
{{range .Rows}}
<tr><td>{{.ID}}</td><td>{{.A}}</td><td>{{.B}}</td><td>￥{{.C}}</td><td>{{.D}}</td>
<td class="text-nowrap"><a href="/admin/products/{{.ID}}/edit">编辑</a> ·
<form method="post" action="/admin/products/{{.ID}}/delete" class="d-inline"><input type="hidden" name="_csrf" value="{{$.CSRF}}"><button class="ui-btn-ghost p-0 text-danger" type="submit">删除</button></form></td></tr>
{{end}}
{{if not .Rows}}<tr><td colspan="6" class="ui-muted">暂无产品，点击右上角新增。</td></tr>{{end}}
</tbody></table></div>
{{end}}
