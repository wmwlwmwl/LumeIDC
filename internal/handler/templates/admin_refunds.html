{{define "page"}}
<div class="admin-page-header">
  <div class="admin-page-title">
    <h1>退款记录</h1>
    <p>查看所有退款处理记录</p>
  </div>
  <div class="admin-page-actions">
    <a href="/admin/orders" class="admin-back-btn">返回订单</a>
  </div>
</div>

{{if .Msg}}<div class="ui-alert ui-alert-success" role="status">操作成功</div>{{end}}

<div class="admin-panel">
  <div class="admin-panel-header">
    <h2>退款记录</h2>
    <label class="list-filter" for="filter-refunds">
      <span class="fx-search-icon" aria-hidden="true"></span>
      <input id="filter-refunds" type="search" data-table-filter="#tblRefunds" placeholder="搜索用户 / 订单 / 原因">
    </label>
  </div>
  <div class="admin-table-wrap">
    <table class="admin-table" id="tblRefunds" data-pageable>
      <thead>
        <tr>
          <th scope="col">ID</th>
          <th scope="col">用户</th>
          <th scope="col">订单</th>
          <th scope="col">金额</th>
          <th scope="col">方式</th>
          <th scope="col">原因</th>
          <th scope="col">管理员</th>
          <th scope="col">时间</th>
        </tr>
      </thead>
      <tbody>
        {{range .Rows}}
        <tr>
          <td class="td-id">{{.ID}}</td>
          <td>{{.UserID}}</td>
          <td>{{.OrderID}}</td>
          <td class="td-price">￥{{.Amount}}</td>
          <td>{{if eq .Method "balance"}}退余额{{else}}线下/手动{{end}}</td>
          <td>{{.Reason}}</td>
          <td>{{.AdminID}}</td>
          <td>{{.CreatedAt}}</td>
        </tr>
        {{end}}
        {{if not .Rows}}
        <tr><td colspan="99" class="admin-table-empty">暂无退款记录</td></tr>
        {{end}}
      </tbody>
    </table>
  </div>
</div>
{{end}}
