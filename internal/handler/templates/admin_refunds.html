{{define "page"}}
<h1>退款记录</h1>
{{if .Msg}}<p style="color:#047857">操作成功</p>{{end}}
<table>
<tr><th>ID</th><th>用户</th><th>订单</th><th>金额</th><th>方式</th><th>原因</th><th>管理员</th><th>时间</th></tr>
{{range .Rows}}<tr>
<td>{{.ID}}</td><td>{{.UserID}}</td><td>{{.OrderID}}</td><td>{{.Amount}}</td>
<td>{{.Method}}</td><td>{{.Reason}}</td><td>{{.AdminID}}</td><td>{{.CreatedAt}}</td>
</tr>{{end}}
</table>
<p><a href="/admin/orders">返回订单</a></p>
{{end}}
