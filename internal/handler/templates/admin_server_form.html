{{define "page"}}
<h1>{{if .Product}}编辑服务器{{else}}添加服务器{{end}}</h1>
<form method="post" action="{{if .Product}}/admin/servers/{{.Product.ID}}/save{{else}}/admin/servers/save{{end}}" style="max-width:520px;background:#fff;padding:20px;border-radius:8px">
<input type="hidden" name="_csrf" value="{{.CSRF}}">
<label style="display:block;margin:10px 0 4px;font-weight:600;font-size:.88rem">名称</label>
<input name="name" value="{{with .Product}}{{.Name}}{{end}}" required style="width:100%;padding:8px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px">
<label style="display:block;margin:10px 0 4px;font-weight:600;font-size:.88rem">上游类型</label>
<select name="provider" id="providerSel" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px" onchange="renderCredFields()">
{{$cur := "zjmf"}}{{with .Product}}{{$cur = .Provider}}{{end}}
{{range .Providers}}
<option value="{{.Code}}" {{if eq .Code $cur}}selected{{end}}>{{.Name}}</option>
{{end}}
</select>
<div id="credFields"></div>
<label style="display:block;margin:10px 0 4px;font-weight:600;font-size:.88rem">状态</label>
<select name="disabled" style="padding:8px;border:1px solid #ccc;border-radius:6px">
<option value="0">启用</option>
<option value="1" {{if and .Product .Product.Disabled}}selected{{end}}>停用</option>
</select>
<label style="display:block;margin:10px 0 4px;font-weight:600;font-size:.88rem">默认利润</label>
<div style="display:flex;gap:8px;align-items:center">
<select name="profit_type" style="padding:8px;border:1px solid #ccc;border-radius:6px">
<option value="0" {{if not (and .Product (eq (printf "%d" .Product.ProfitType) "1"))}}selected{{end}}>百分比（%）</option>
<option value="1" {{if and .Product (eq (printf "%d" .Product.ProfitType) "1")}}selected{{end}}>固定金额</option>
</select>
<input name="profit_value" type="number" step="0.01" min="0" value="{{if .Product}}{{.Product.ProfitValue}}{{else}}0{{end}}" placeholder="如 30 或 5" style="width:140px;padding:8px;border:1px solid #ccc;border-radius:6px">
</div>
<p class="muted" style="font-size:.78rem;margin:4px 0 0">该上游下产品未单独设利润时，使用此默认值</p>
<button style="margin-top:18px;width:100%;padding:11px;background:#4f46e5;color:#fff;border:0;border-radius:6px;cursor:pointer">保存</button>
</form>
<script>
// 凭据字段由各上游 provider 声明（PROV.fields），选择类型时切换渲染；编辑时回填已有值。
const PROV = {{.ProviderFieldsJSON}};
function escAttr(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;");}
function renderCredFields(){
  const sel = document.getElementById("providerSel");
  const code = sel ? sel.value : "zjmf";
  const fields = (PROV.fields && PROV.fields[code]) || [];
  document.getElementById("credFields").innerHTML = fields.map(f=>{
    const val = (PROV.values && PROV.values[f.name]) || "";
    const type = f.secret ? "password" : "text";
    const req = f.required ? " required" : "";
    const ph = f.placeholder ? ' placeholder="'+escAttr(f.placeholder)+'"' : "";
    const auto = f.secret ? ' autocomplete="new-password"' : ' autocomplete="off"';
    return '<label style="display:block;margin:10px 0 4px;font-weight:600;font-size:.88rem">'+f.label+'</label>'+
      '<input name="'+f.name+'" value="'+escAttr(val)+'" type="'+type+'"'+ph+req+auto+
      ' style="width:100%;padding:8px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px">';
  }).join("");
}
renderCredFields();
</script>
{{end}}
