{{define "page"}}
<div class="admin-page-header">
  <div class="admin-page-title">
    <h1>{{if .Product}}编辑服务器{{else}}添加服务器{{end}}</h1>
    <p>配置供应商连接、状态与默认利润</p>
  </div>
  <div class="admin-page-actions">
    <a href="/admin/servers" class="admin-back-btn">返回服务器列表</a>
  </div>
</div>

{{if .Error}}<div class="ui-alert ui-alert-error" role="alert">{{.Error}}</div>{{end}}

<form method="post" action="{{if .Product}}/admin/servers/{{.Product.ID}}/save{{else}}/admin/servers/save{{end}}" class="admin-panel admin-form-narrow">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  <div class="admin-panel-body">
    <div class="admin-form-section">
      <h3>连接配置</h3>
      <label for="server-name">服务器名称</label>
      <input id="server-name" name="name" value="{{with .Product}}{{.Name}}{{end}}" placeholder="如 ZJMF 主节点" required>

      <label for="providerSel">上游类型</label>
      <select name="provider" id="providerSel" onchange="renderCredFields()">
        {{$cur := "zjmf"}}{{with .Product}}{{$cur = .Provider}}{{end}}
        {{range .Providers}}
        <option value="{{.Code}}" {{if eq .Code $cur}}selected{{end}}>{{.Name}}</option>
        {{end}}
      </select>

      <div id="credFields" class="admin-cred-fields"></div>
    </div>

    <div class="admin-form-section">
      <h3>运行状态</h3>
      <select name="disabled" id="server-disabled" aria-label="运行状态">
        <option value="0">启用</option>
        <option value="1" {{if and .Product .Product.Disabled}}selected{{end}}>停用</option>
      </select>
    </div>

    <div class="admin-form-section">
      <h3>默认利润</h3>
      <p class="text-muted small">该上游下产品未单独设利润时，使用此默认值。</p>
      <div class="admin-form-row">
        <div class="admin-form-col">
          <label for="profit-type">利润方式</label>
          <select id="profit-type" name="profit_type">
            <option value="0" {{if not (and .Product (eq (printf "%d" .Product.ProfitType) "1"))}}selected{{end}}>百分比（%）</option>
            <option value="1" {{if and .Product (eq (printf "%d" .Product.ProfitType) "1")}}selected{{end}}>固定金额（元）</option>
          </select>
        </div>
        <div class="admin-form-col">
          <label for="profit-value">利润值</label>
          <input id="profit-value" name="profit_value" type="number" step="0.01" min="0" value="{{if .Product}}{{.Product.ProfitValue}}{{else}}0{{end}}" placeholder="如 30 或 5">
        </div>
      </div>
    </div>

    <div class="admin-form-actions">
      <button class="ui-btn" type="submit">保存服务器 <span>→</span></button>
      <a class="ui-btn ui-btn-secondary" href="/admin/servers">取消</a>
    </div>
  </div>
</form>

<script>
// 凭据字段由各上游 provider 声明（PROV.fields），选择类型时切换渲染；编辑时回填已有值。
const PROV = {{.ProviderFieldsJSON}};
function escAttr(s){return String(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;");}
function renderCredFields(){
  const sel = document.getElementById("providerSel");
  const code = sel ? sel.value : "zjmf";
  const fields = (PROV.fields && PROV.fields[code]) || [];
  document.getElementById("credFields").innerHTML = fields.map(f=>{
    const val = (PROV.values && PROV.values[f.name]) || "";
    const type = f.secret ? "password" : "text";
    const req = f.required ? " required" : "";
    const ph = f.placeholder ? ' placeholder="'+escAttr(f.placeholder)+'"' : "";
    const auto = f.secret ? ' autocomplete="new-password"' : ' autocomplete="off"';
    return '<label>'+f.label+'</label>'+
      '<input name="'+f.name+'" value="'+escAttr(val)+'" type="'+type+'"'+ph+req+auto+'>';
  }).join("");
}
renderCredFields();
</script>
{{end}}
