{{define "page"}}
<div class="d-flex align-items-center justify-content-between gap-3 flex-wrap mb-4">
<h1 class="h3 mb-0">上游服务器</h1>
<a class="ui-btn" href="/admin/servers/new">添加服务器</a>
</div>
{{if .Error}}<div class="ui-alert ui-alert-error" role="alert">{{.Error}}</div>{{end}}
<div class="ui-table-wrap" aria-label="上游服务器列表"><table><thead><tr><th scope="col">ID</th><th scope="col">名称</th><th scope="col">类型</th><th scope="col">API 地址</th><th scope="col">状态</th><th scope="col">操作</th></tr></thead><tbody>
{{range .Rows}}
<tr id="srv-{{.ID}}"><td>{{.ID}}</td><td>{{.A}}</td><td>{{.B}}</td><td>{{.C}}</td><td>{{.D}}</td>
<td class="text-nowrap"><a href="/admin/servers/{{.ID}}/edit">编辑</a> · <a href="/admin/servers/{{.ID}}/catalog">浏览商品</a> ·
<a href="#" onclick="testConn({{.ID}}, this);return false" class="text-success">测试</a><span class="testmsg ui-muted ms-1"></span> ·
<form method="post" action="/admin/servers/{{.ID}}/delete" class="d-inline"><input type="hidden" name="_csrf" value="{{$.CSRF}}"><button class="ui-btn-ghost p-0 text-danger" type="submit">删除</button></form></td></tr>
{{end}}
{{if not .Rows}}<tr><td colspan="6" class="ui-muted">暂无上游服务器。ZJMF 对接需要 API 地址、用户名、密钥。</td></tr>{{end}}
</tbody></table></div>
<script>
async function testConn(id, a){
  const span = a.parentElement.querySelector(".testmsg");
  span.textContent = "测试中…"; span.className = "testmsg ui-muted ms-1";
  try {
    const r = await fetch(`/admin/servers/${id}/test`);
    const j = await r.json();
    span.textContent = j.msg; span.className = "testmsg ms-1 " + (j.ok === "1" ? "text-success" : "text-danger");
  } catch(e){ span.textContent = "请求失败"; span.className = "testmsg ms-1 text-danger"; }
}
</script>
{{end}}
