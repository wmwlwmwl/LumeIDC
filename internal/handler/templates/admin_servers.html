{{define "page"}}
<div style="display:flex;align-items:center;justify-content:space-between">
<h1>上游服务器</h1>
<a class="btn" href="/admin/servers/new" style="background:#4f46e5;color:#fff;padding:8px 16px;border-radius:6px;text-decoration:none">添加服务器</a>
</div>
{{if .Error}}<p style="color:#b91c1c">{{.Error}}</p>{{end}}
<table><tr><th>ID</th><th>名称</th><th>类型</th><th>API 地址</th><th>状态</th><th>操作</th></tr>
{{range .Rows}}
<tr id="srv-{{.ID}}"><td>{{.ID}}</td><td>{{.A}}</td><td>{{.B}}</td><td>{{.C}}</td><td>{{.D}}</td>
<td><a href="/admin/servers/{{.ID}}/edit">编辑</a> · <a href="/admin/servers/{{.ID}}/catalog">浏览商品</a> ·
<a href="#" onclick="testConn({{.ID}}, this);return false" style="color:#15803d;text-decoration:none">测试</a><span class="testmsg" style="font-size:.8rem;margin-left:4px"></span> ·
<form method="post" action="/admin/servers/{{.ID}}/delete" style="display:inline"><input type="hidden" name="_csrf" value="{{$.CSRF}}"><button style="background:none;border:0;color:#b91c1c;cursor:pointer;padding:0;font-size:.88rem">删除</button></form></td></tr>
{{end}}
{{if not .Rows}}<tr><td colspan="6" style="color:#888">暂无上游服务器。ZJMF 对接需要 API 地址、用户名、密钥。</td></tr>{{end}}
</table>
<script>
async function testConn(id, a){
  const span = a.parentElement.querySelector(".testmsg");
  span.textContent = "测试中…"; span.style.color = "#888";
  try {
    const r = await fetch(`/admin/servers/${id}/test`);
    const j = await r.json();
    span.textContent = j.msg; span.style.color = j.ok === "1" ? "#15803d" : "#b91c1c";
  } catch(e){ span.textContent = "请求失败"; span.style.color = "#b91c1c"; }
}
</script>
{{end}}
