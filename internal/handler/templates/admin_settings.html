{{define "page"}}
<h1>通知与邮件配置</h1>
{{if .Error}}<p style="color:#b91c1c">{{.Error}}</p>{{end}}
{{if .Msg}}<p style="color:#047857">已保存</p>{{end}}
<form method="post" action="/admin/settings" style="display:flex;gap:10px;flex-direction:column;max-width:420px">
<input type="hidden" name="_csrf" value="{{.CSRF}}">
<label>SMTP 主机</label>
<input name="smtp_host" value="{{index .ServersList "smtp_host"}}">
<label>SMTP 端口</label>
<input name="smtp_port" value="{{index .ServersList "smtp_port"}}" placeholder="587">
<label>用户名</label>
<input name="smtp_user" value="{{index .ServersList "smtp_user"}}">
<label>密码</label>
<input type="password" name="smtp_pass" value="{{index .ServersList "smtp_pass"}}">
<label>发件人</label>
<input name="smtp_from" value="{{index .ServersList "smtp_from"}}" placeholder="noreply@example.com">
<label><input type="checkbox" name="notify_email_enabled" value="1" {{if eq (index .ServersList "notify_email_enabled") "1"}}checked{{end}}> 启用邮件通知</label>
<button type="submit" style="width:120px">保存</button>
</form>
<p class="muted">未启用邮件时，通知仅以站内信形式下发。</p>
{{end}}
