{{define "page"}}
<h1>分类管理</h1>
{{if .Error}}<p style="color:#b91c1c">{{.Error}}</p>{{end}}
<table><tr><th>ID</th><th>名称</th><th>描述</th><th>排序</th><th>操作</th></tr>
{{range .Rows}}
<tr><td>{{.ID}}</td><td>{{.A}}</td><td>{{.B}}</td><td>{{.C}}</td>
<td>
<details style="display:inline"><summary style="cursor:pointer;color:#4f46e5;display:inline">编辑</summary>
<form method="post" action="/admin/types/save" style="margin-top:8px;background:#fff;padding:12px;border:1px solid #e5e7eb;border-radius:6px;width:280px">
<input type="hidden" name="_csrf" value="{{$.CSRF}}"><input type="hidden" name="id" value="{{.ID}}">
<input name="name" value="{{.A}}" placeholder="名称" required style="width:100%;padding:6px;margin-bottom:6px;box-sizing:border-box">
<input name="description" value="{{.B}}" placeholder="描述" style="width:100%;padding:6px;margin-bottom:6px;box-sizing:border-box">
<input name="sort" type="number" value="{{.C}}" placeholder="排序" style="width:80px;padding:6px;margin-bottom:6px">
<button style="padding:6px 14px;background:#4f46e5;color:#fff;border:0;border-radius:4px;cursor:pointer">保存</button>
</form></details> ·
<form method="post" action="/admin/types/{{.ID}}/delete" style="display:inline"><input type="hidden" name="_csrf" value="{{$.CSRF}}"><button style="background:none;border:0;color:#b91c1c;cursor:pointer;padding:0;font-size:.88rem">删除</button></form>
</td></tr>
{{end}}
</table>
<div style="margin-top:24px;background:#fff;padding:18px;border-radius:8px;max-width:360px">
<h3 style="margin-top:0">新增分类</h3>
<form method="post" action="/admin/types/save">
<input type="hidden" name="_csrf" value="{{.CSRF}}">
<input name="name" placeholder="名称" required style="width:100%;padding:8px;margin-bottom:8px;box-sizing:border-box">
<input name="description" placeholder="描述" style="width:100%;padding:8px;margin-bottom:8px;box-sizing:border-box">
<input name="sort" type="number" value="0" placeholder="排序" style="width:90px;padding:8px;margin-bottom:8px">
<button style="padding:8px 20px;background:#4f46e5;color:#fff;border:0;border-radius:6px;cursor:pointer">添加</button>
</form>
</div>
{{end}}
