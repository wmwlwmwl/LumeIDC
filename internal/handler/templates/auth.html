<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LumeIDC</title>
<style>
body{font-family:system-ui,sans-serif;max-width:420px;margin:56px auto;padding:0 16px;color:#1a1a2e}
h1{font-size:1.3rem}label{display:block;margin:12px 0 4px;font-weight:600;font-size:.9rem}
input{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;font-size:1rem}
button{margin-top:18px;width:100%;padding:11px;background:#4f46e5;color:#fff;border:0;border-radius:6px;font-size:1rem;cursor:pointer}
.error{background:#fee2e2;color:#b91c1c;padding:10px;border-radius:6px;margin-top:14px;font-size:.9rem}
.alt{margin-top:16px;font-size:.88rem;text-align:center}.alt a{color:#4f46e5}
</style>
</head>
<body>
<h1>LumeIDC</h1>
{{if .Error}}<div class="error">{{.Error}}</div>{{end}}
{{if .IsAdmin}}<h2>管理员登录</h2>
<form method="post" action="/admin/login">
<input type="hidden" name="_csrf" value="{{.CSRF}}">
<label>用户名</label><input name="email" required autocomplete="username">
<label>密码</label><input name="password" type="password" required autocomplete="current-password">
<label>两步验证码（如已启用）</label><input name="totp" inputmode="numeric" autocomplete="one-time-code">
<button>登录</button>
</form>
{{else if .IsRegister}}<h2>注册</h2>
<form method="post" action="/register">
<input type="hidden" name="_csrf" value="{{.CSRF}}">
<label>邮箱</label><input name="email" type="email" required>
<label>姓名</label><input name="name">
<label>密码</label><input name="password" type="password" minlength="8" required>
<button>注册</button>
</form>
<p class="alt">已有账号？<a href="/login">登录</a></p>
{{else}}<h2>登录</h2>
<form method="post" action="/login">
<input type="hidden" name="_csrf" value="{{.CSRF}}">
<input type="hidden" name="next" value="{{.Next}}">
<label>邮箱</label><input name="email" type="email" required>
<label>密码</label><input name="password" type="password" required>
<button>登录</button>
</form>
<p class="alt">没有账号？<a href="/register">注册</a></p>
<p class="alt"><a href="/admin/login">管理员登录</a></p>
{{end}}
</body>
</html>
