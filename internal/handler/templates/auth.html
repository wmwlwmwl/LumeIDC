<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LumeIDC</title>
<link rel="stylesheet" href="/assets/vendor/bootstrap-5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="/assets/css/lume.css">
</head>
<body>
<a class="ui-skip" href="#auth-main">跳到主要内容</a>
<main class="site-main" id="auth-main">
<div class="ui-card ui-form mx-auto" style="max-width:440px">
<h1 class="h3 mb-4">LumeIDC</h1>
{{if .Error}}<div class="ui-alert ui-alert-error" role="alert">{{.Error}}</div>{{end}}
{{if .IsAdmin}}<h2 class="h5">管理员登录</h2>
<form method="post" action="/admin/login">
<input type="hidden" name="_csrf" value="{{.CSRF}}">
<label for="auth-email">用户名</label><input class="form-control" id="auth-email" name="email" required autocomplete="username">
<label class="mt-3" for="auth-password">密码</label><input class="form-control" id="auth-password" name="password" type="password" required autocomplete="current-password">
<label class="mt-3" for="auth-totp">两步验证码（如已启用）</label><input class="form-control" id="auth-totp" name="totp" inputmode="numeric" autocomplete="one-time-code">
<button class="ui-btn w-100 mt-4" type="submit">登录</button>
</form>
{{else if .IsRegister}}<h2 class="h5">注册</h2>
<form method="post" action="/register">
<input type="hidden" name="_csrf" value="{{.CSRF}}">
<label for="auth-email">邮箱</label><input class="form-control" id="auth-email" name="email" type="email" required>
<label class="mt-3" for="auth-name">姓名</label><input class="form-control" id="auth-name" name="name">
<label class="mt-3" for="auth-password">密码</label><input class="form-control" id="auth-password" name="password" type="password" minlength="8" required autocomplete="new-password">
<button class="ui-btn w-100 mt-4" type="submit">注册</button>
</form>
<p class="text-center mt-3 mb-0">已有账号？<a href="/login">登录</a></p>
{{else}}<h2 class="h5">登录</h2>
<form method="post" action="/login">
<input type="hidden" name="_csrf" value="{{.CSRF}}"><input type="hidden" name="next" value="{{.Next}}">
<label for="auth-email">邮箱</label><input class="form-control" id="auth-email" name="email" type="email" required autocomplete="username">
<label class="mt-3" for="auth-password">密码</label><input class="form-control" id="auth-password" name="password" type="password" required autocomplete="current-password">
<button class="ui-btn w-100 mt-4" type="submit">登录</button>
</form>
<p class="text-center mt-3 mb-1">没有账号？<a href="/register">注册</a></p>
<p class="text-center mb-0"><a href="/admin/login">管理员登录</a></p>
{{end}}
</div>
</main>
</body>
</html>
