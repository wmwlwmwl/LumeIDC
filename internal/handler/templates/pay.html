<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>账单支付 - LumeIDC</title>
<style>body{font-family:system-ui,sans-serif;max-width:420px;margin:56px auto;padding:0 16px}
.card{border:1px solid #e5e7eb;border-radius:8px;padding:20px}.amount{font-size:1.6rem;font-weight:700;color:#4f46e5}
button{width:100%;padding:11px;background:#4f46e5;color:#fff;border:0;border-radius:6px;font-size:1rem;cursor:pointer;margin-top:16px}</style>
</head>
<body>
<div class="card">
<h1>{{if .Recharge}}余额充值{{else}}账单{{end}} {{.InvoiceNo}}</h1>
<p class="amount">￥{{.Amount}}</p>
{{if .Status}}<p>{{.Status}}</p>
{{else}}
<p style="color:#666;font-size:.85rem;margin:10px 0 0">账户余额：<b style="color:#4f46e5">￥{{.UserBalance}}</b></p>
<div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">
{{range .Gateways}}
<form method="post" action="/pay/{{$.InvoiceID}}/start" style="margin:0">
<input type="hidden" name="_csrf" value="{{$.CSRF}}"><input type="hidden" name="gateway" value="{{.Code}}">
<button style="margin-top:0">在线支付：{{.Name}}</button>
</form>
{{end}}
{{if .BalancePay}}
<form method="post" action="/pay/{{.InvoiceID}}/balance">
<input type="hidden" name="_csrf" value="{{.CSRF}}">
<button style="background:#15803d">余额支付</button>
</form>
{{end}}
</div>
{{end}}
</div>
</body>
</html>
