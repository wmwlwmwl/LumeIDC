{{define "page"}}
<div class="d-flex align-items-center gap-3 flex-wrap mb-4">
<h1 class="h3 mb-0">我的服务</h1>
<a class="ui-btn ui-btn-secondary ms-auto" href="/products">购买服务</a>
</div>
{{if .Services}}
<div class="ui-table-wrap" aria-label="我的服务列表">
<table><thead><tr><th scope="col">ID</th><th scope="col">名称</th><th scope="col">状态</th><th scope="col">到期时间</th><th scope="col">操作</th></tr></thead><tbody>
{{range .Services}}
<tr>
<td>{{.ID}}</td><td><a href="/services/{{.ID}}">{{.Name}}</a></td>
<td><span class="badge {{if eq .StatusText "激活"}}badge-ok{{else if eq .StatusText "已停机"}}badge-warn{{else}}badge-idle{{end}}">{{.StatusText}}</span></td>
<td{{if .ExpiringSoon}} class="text-danger fw-semibold"{{end}}>{{.ExpiresAt.Format "2006-01-02"}}</td>
<td class="text-nowrap">
<a class="ui-btn ui-btn-secondary py-1 px-2" href="/services/{{.ID}}">管理</a>
{{if ne .StatusText "待开通"}}
<form method="post" action="/services/{{.ID}}/renew" class="d-inline-flex align-items-center gap-1 ms-1">
<input type="hidden" name="_csrf" value="{{$.CSRF}}">
<label class="visually-hidden" for="renew-cycle-{{.ID}}">续费周期</label>
<select name="cycle" id="renew-cycle-{{.ID}}" class="form-select form-select-sm w-auto">
<option value="monthly">月付</option>{{if .ShowQ}}<option value="quarterly">季付</option>{{end}}{{if .ShowY}}<option value="yearly">年付</option>{{end}}
</select>
<button class="ui-btn py-1 px-2" type="submit">续费</button>
</form>
{{end}}
</td></tr>
{{end}}
</tbody></table></div>
{{else}}<div class="ui-card text-center py-5"><p class="ui-muted mb-3">还没有服务，去购买一个吧。</p><a class="ui-btn" href="/products">浏览产品</a></div>{{end}}
{{end}}
