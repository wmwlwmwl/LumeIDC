{{define "page"}}
<h1>我的服务</h1>
{{if .Services}}
<table><tr><th>ID</th><th>名称</th><th>状态</th><th>到期时间</th><th>操作</th></tr>
{{range .Services}}
<tr>
<td>{{.ID}}</td><td><a href="/services/{{.ID}}" style="color:#4f46e5;text-decoration:none">{{.Name}}</a></td>
<td><span class="badge {{if eq .StatusText "激活"}}badge-ok{{else if eq .StatusText "已停机"}}badge-warn{{else}}badge-idle{{end}}">{{.StatusText}}</span></td>
<td{{if .ExpiringSoon}} style="color:#b91c1c;font-weight:600"{{end}}>{{.ExpiresAt.Format "2006-01-02"}}</td>
<td style="white-space:nowrap">
<a class="btn" href="/services/{{.ID}}" style="background:#f1f5f9;color:#333;border:1px solid #e5e7eb;padding:4px 12px;font-size:.82rem">管理</a>
{{if ne .StatusText "待开通"}}
<form method="post" action="/services/{{.ID}}/renew" style="display:inline;margin-left:6px">
<input type="hidden" name="_csrf" value="{{$.CSRF}}">
<select name="cycle" style="padding:4px;border:1px solid #ccc;border-radius:4px;font-size:.82rem">
<option value="monthly">月付</option>{{if .ShowQ}}<option value="quarterly">季付</option>{{end}}{{if .ShowY}}<option value="yearly">年付</option>{{end}}
</select>
<button style="padding:4px 10px;background:#4f46e5;color:#fff;border:0;border-radius:4px;cursor:pointer;font-size:.82rem">续费</button>
</form>
{{end}}
</td></tr>
{{end}}
</table>
{{else}}<p class="muted">还没有服务，去 <a href="/products">购买一个</a> 吧。</p>{{end}}
{{end}}
