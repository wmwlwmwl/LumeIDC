{{define "site"}}
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LumeIDC</title>
<link rel="stylesheet" href="/assets/vendor/bootstrap-5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="/assets/css/lume.css">
<script src="/assets/js/lume.js" defer></script>
</head>
<body>
<a class="ui-skip" href="#main-content">跳到主要内容</a>
<header class="site-header" data-site-header>
<div class="site-header-inner">
<a class="brand" href="/">LumeIDC</a>
<button class="site-menu-toggle" type="button" data-site-menu aria-controls="site-nav" aria-expanded="false">菜单</button>
<nav class="site-nav" id="site-nav" aria-label="主导航">
<a href="/products">产品</a>
{{if .LoggedIn}}<a href="/services">我的服务</a>{{end}}
</nav>
<div class="site-account">
{{if .LoggedIn}}
<span class="text-primary small">￥{{.Balance}}</span>
<a href="/user">用户中心</a>
<a href="/notifications">站内信</a>
<form method="post" action="/logout" class="m-0"><input type="hidden" name="_csrf" value="{{.CSRF}}"><button class="ui-btn-ghost" type="submit">退出</button></form>
{{else}}
<a href="/login">登录</a><a href="/register">注册</a>
{{end}}
</div>
</div>
</header>
<main class="site-main" id="main-content">{{template "page" .}}</main>
</body>
</html>
{{end}}
