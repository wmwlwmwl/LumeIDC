{{define "page"}}
<div class="fx-page-head">
  <div class="fx-page-title">
    <span class="eyebrow">NOTIFICATIONS</span>
    <h1>消息中心</h1>
    <p>查看系统通知和服务提醒</p>
  </div>
</div>

{{if .Rows}}
<div class="fx-panel fx-notice-panel">
  {{range .Rows}}
  <div class="fx-msg-item">
    <div class="fx-msg-item-head">
      <strong>{{.title}}</strong>
      <small>{{.time}}</small>
    </div>
    <div class="fx-msg-item-body">{{.body}}</div>
  </div>
  {{end}}
</div>
{{else}}
<div class="fx-panel">
  <div class="fx-empty-state">
    <div class="fx-empty-icon"></div>
    <h3>暂无消息</h3>
    <p>系统通知和提醒会显示在这里</p>
  </div>
</div>
{{end}}
{{end}}
