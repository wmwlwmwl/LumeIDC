{{define "page"}}
<h1 class="h3 mb-4">站内信</h1>
{{if not .Rows}}<div class="ui-card text-center py-5"><p class="ui-muted mb-0">暂无消息</p></div>{{end}}
{{if .Rows}}<div class="ui-card p-0"><ul class="list-unstyled mb-0">
{{range .Rows}}
<li class="p-3 border-bottom">
<div class="fw-semibold">{{.title}}</div>
<div class="ui-muted small">{{.time}}</div>
<div class="mt-1">{{.body}}</div>
</li>
{{end}}
</ul></div>{{end}}
{{end}}
