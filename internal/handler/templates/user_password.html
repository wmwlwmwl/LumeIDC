{{define "page"}}
<div class="fx-page-head">
  <div class="fx-page-title">
    <span class="eyebrow">SECURITY</span>
    <h1>安全设置</h1>
    <p>定期更新密码，保护你的账户安全</p>
  </div>
</div>

<div class="fx-form-panel">
  {{if .OK}}<div class="ui-alert ui-alert-success" role="status">密码修改成功。</div>{{end}}
  {{if .Error}}<div class="ui-alert ui-alert-error" role="alert">{{.Error}}</div>{{end}}
  <form method="post" action="/user/password" class="fx-stack-form">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <label for="password-old">当前密码</label>
    <input id="password-old" type="password" name="old" required autocomplete="current-password">
    <label for="password-new">新密码（至少 8 位）</label>
    <input id="password-new" type="password" name="new" minlength="8" required autocomplete="new-password">
    <button class="ui-btn" type="submit">保存密码 <span>→</span></button>
  </form>
</div>
{{end}}
