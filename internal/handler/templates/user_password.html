{{define "page"}}
<div class="card" style="max-width:440px">
<h1>修改密码</h1>
{{if .OK}}<p style="color:#15803d">密码修改成功。</p>{{end}}
{{if .Error}}<div class="error" style="background:#fee2e2;color:#b91c1c;padding:10px;border-radius:6px;margin-bottom:12px;font-size:.9rem">{{.Error}}</div>{{end}}
<form method="post" action="/user/password">
<input type="hidden" name="_csrf" value="{{.CSRF}}">
<label style="display:block;margin:10px 0 4px;font-weight:600;font-size:.9rem">当前密码</label>
<input type="password" name="old" required style="width:100%;padding:9px;border:1px solid #ccc;border-radius:6px">
<label style="display:block;margin:10px 0 4px;font-weight:600;font-size:.9rem">新密码（至少 8 位）</label>
<input type="password" name="new" minlength="8" required style="width:100%;padding:9px;border:1px solid #ccc;border-radius:6px">
<button style="margin-top:16px;width:100%;padding:11px;background:#4f46e5;color:#fff;border:0;border-radius:6px;cursor:pointer">保存</button>
</form>
</div>
{{end}}
