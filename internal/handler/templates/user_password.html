{{define "page"}}
<div class="ui-card ui-form">
<h1 class="h3 mb-4">修改密码</h1>
{{if .OK}}<div class="ui-alert ui-alert-success" role="status">密码修改成功。</div>{{end}}
{{if .Error}}<div class="ui-alert ui-alert-error" role="alert">{{.Error}}</div>{{end}}
<form method="post" action="/user/password">
<input type="hidden" name="_csrf" value="{{.CSRF}}">
<label for="password-old">当前密码</label>
<input class="form-control" id="password-old" type="password" name="old" required autocomplete="current-password">
<label class="mt-3" for="password-new">新密码（至少 8 位）</label>
<input class="form-control" id="password-new" type="password" name="new" minlength="8" required autocomplete="new-password">
<button class="ui-btn w-100 mt-3" type="submit">保存</button>
</form>
</div>
{{end}}
