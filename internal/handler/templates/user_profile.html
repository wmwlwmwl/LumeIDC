{{define "page"}}
<div class="fx-page-head">
  <div class="fx-page-title"><h1>资料与手机号</h1><p>绑定并验证手机号，保护账户安全。</p></div>
</div>
<div class="fx-form-panel">
  {{if .OK}}<div class="ui-alert ui-alert-success" role="status">{{.OK}}</div>{{end}}
  {{if .Error}}<div class="ui-alert ui-alert-error" role="alert">{{.Error}}</div>{{end}}
  {{if .HasPhone}}
  <p>当前手机号：<strong>{{.PhoneMasked}}</strong>　<span class="text-muted">{{if .PhoneVerified}}已验证{{else}}未验证{{end}}</span></p>
  {{if .PhoneVerified}}
  <details>
    <summary>换绑手机号</summary>
    <form method="post" action="/user/profile/phone/send" class="fx-stack-form">
      <input type="hidden" name="_csrf" value="{{.CSRF}}">
      <label for="phone-change-password">当前密码</label>
      <input id="phone-change-password" name="current_password" type="password" autocomplete="current-password" required>
      <label for="phone-change">新手机号</label>
      <input id="phone-change" name="phone" inputmode="tel" autocomplete="tel" required pattern="(?:\+?86)?1[3-9][0-9]{9}">
      <button class="ui-btn" type="submit">发送验证码 <span>→</span></button>
    </form>
  </details>
  {{else}}
  <form method="post" action="/user/profile/phone/send" class="fx-stack-form">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <input type="hidden" name="phone" value="{{.Phone}}">
    <label for="phone-verify-password">当前密码</label>
    <input id="phone-verify-password" name="current_password" type="password" autocomplete="current-password" required>
    <button class="ui-btn" type="submit">发送验证短信 <span>→</span></button>
  </form>
  {{end}}
  {{else}}
  <p>尚未绑定手机号。</p>
  <form method="post" action="/user/profile/phone/send" class="fx-stack-form">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <label for="phone-bind">手机号</label>
    <input id="phone-bind" name="phone" inputmode="tel" autocomplete="tel" required pattern="(?:\+?86)?1[3-9][0-9]{9}">
    <button class="ui-btn" type="submit">发送验证码 <span>→</span></button>
  </form>
  {{end}}
  <hr>
  <form method="post" action="/user/profile/phone/confirm" class="fx-stack-form">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <label for="phone-code">短信验证码</label>
    <input id="phone-code" name="code" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6" required>
    <button class="ui-btn" type="submit">确认手机号 <span>→</span></button>
  </form>
</div>
{{end}}
