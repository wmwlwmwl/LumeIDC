{{define "page"}}
<div class="fx-page-head">
  <div class="fx-page-title">
    <span class="eyebrow">ACCOUNT BALANCE</span>
    <h1>账户充值</h1>
    <p>充值后可直接用于购买和续费服务</p>
  </div>
</div>

{{if .Error}}<div class="ui-alert ui-alert-error" role="alert">{{.Error}}</div>{{end}}

<div class="fx-form-panel">
  <div class="fx-balance-block">
    <span>当前余额</span>
    <strong>￥{{.Balance}}</strong>
  </div>
  <form method="post" action="/user/recharge" class="fx-stack-form">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <label for="recharge-amount">充值金额（元）</label>
    <input id="recharge-amount" name="amount" type="number" min="0.01" max="9999999999" step="0.01" required placeholder="请输入充值金额">
    <button class="ui-btn" type="submit">生成充值账单 <span>→</span></button>
  </form>
</div>
{{end}}
