{{define "page"}}
<h1 class="h3 mb-4">余额充值</h1>
{{if .Error}}<div class="ui-alert ui-alert-error" role="alert">{{.Error}}</div>{{end}}
<div class="ui-card ui-form">
<p class="ui-muted">当前余额：￥{{.Balance}}</p>
<form method="post" action="/user/recharge">
<input type="hidden" name="_csrf" value="{{.CSRF}}">
<label for="recharge-amount">充值金额</label>
<input class="form-control" id="recharge-amount" name="amount" type="number" min="0.01" max="9999999999" step="0.01" required placeholder="请输入充值金额">
<button class="ui-btn w-100 mt-3" type="submit">生成充值账单</button>
</form>
</div>
{{end}}
